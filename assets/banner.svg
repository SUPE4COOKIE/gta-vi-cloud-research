<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="GTA VI Cloud Research — investigating Xbox Cloud Gaming console authentication">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e0c"/>
      <stop offset="0.55" stop-color="#0e1512"/>
      <stop offset="1" stop-color="#0b1310"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#16211b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#panel)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.65"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(72,72) scale(0.34)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="#0b0f0d" stroke="#1e2a24" stroke-width="6"/>
    <rect x="118" y="140" width="276" height="176" rx="18" fill="none" stroke="#39ff88" stroke-width="16"/>
    <path d="M212 316 v26 h88 v-26" fill="none" stroke="#39ff88" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M186 356 h140" stroke="#39ff88" stroke-width="16" stroke-linecap="round"/>
    <circle cx="182" cy="196" r="12" fill="#39ff88"/>
    <circle cx="222" cy="196" r="12" fill="#39ff88" opacity="0.55"/>
    <circle cx="262" cy="196" r="12" fill="#39ff88" opacity="0.25"/>
  </g>

  <!-- wordmark -->
  <text x="268" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#e9fff2" letter-spacing="-0.5">GTA VI Cloud Research</text>
  <text x="270" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7fe0a8" letter-spacing="0.5">device identity · attestation · console-restricted streaming</text>
  <text x="270" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" fill="#8ea99b">Independent research. Not a port, not an emulator, not a bypass.</text>

  <!-- status strip -->
  <rect x="270" y="266" width="150" height="26" rx="13" fill="#123222" stroke="#1e4d33"/>
  <text x="345" y="284" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#39ff88">RESEARCH ACTIVE</text>
  <rect x="432" y="266" width="150" height="26" rx="13" fill="#2a1113" stroke="#4d1e22"/>
  <text x="507" y="284" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#ff8a8a">BYPASS: NONE</text>
</svg>
