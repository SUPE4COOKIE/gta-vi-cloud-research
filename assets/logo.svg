<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GTA VI Cloud Research mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0d"/>
      <stop offset="1" stop-color="#111814"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#0f9d58"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#1e2a24" stroke-width="4"/>
  <!-- display frame -->
  <rect x="118" y="140" width="276" height="176" rx="18" fill="none" stroke="url(#edge)" stroke-width="14"/>
  <!-- stand -->
  <path d="M212 316 v26 h88 v-26" fill="none" stroke="#39ff88" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 356 h140" stroke="#39ff88" stroke-width="14" stroke-linecap="round"/>
  <!-- device signal dots -->
  <circle cx="182" cy="196" r="12" fill="#39ff88"/>
  <circle cx="222" cy="196" r="12" fill="#39ff88" opacity="0.55"/>
  <circle cx="262" cy="196" r="12" fill="#39ff88" opacity="0.25"/>
  <!-- scan line -->
  <path d="M150 258 h212" stroke="#39ff88" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <!-- research tick -->
  <path d="M330 300 l26 26 l46 -52" fill="none" stroke="#b8ffd6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
